 .calendar-print-stack .calendar-paper .calendar-layout{flex:1!important;min-height:0!important;height:auto!important;align-items:stretch!important;overflow:hidden!important}

 .calendar-print-stack .calendar-paper .cal-cell,.calendar-print-stack .calendar-paper .cal-week-label{height:auto!important;min-height:0!important;overflow:hidden!important}
